# ---------------------------------------------------------------------------
# Assurance Scan — hosted stack (local parity with the cloud deployment).
#
#   Local:    docker compose up -d --build
#   Cloud:    same file on a small VM (e.g. a 512MB DigitalOcean droplet):
#             docker login ghcr.io once, then
#             `docker compose pull server && docker compose up -d`
#             so the VM never builds (publish-app-image builds in CI).
#
# The DB is a single SQLite file inside the named volume — backup = copy it.
# The docker socket mount keeps local-folder scans working where a real
# docker daemon is present; omit it on hosts that shouldn't scan locally.
# ---------------------------------------------------------------------------
name: assurance-scan

services:
  server:
    # Dual mode: local `up --build` builds and tags; memory-constrained
    # hosts `docker compose pull` the CI-published image instead
    # (publish-app-image publishes an immutable candidate for reviewed rollout).
    build: .
    image: ghcr.io/26457513/assurance-scan-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8742:8000"   # loopback only; expose via tailscale/VPN or a proxy
    env_file: .env
    environment:
      ASSURANCE_SCAN_DB_PATH: /data/db.sqlite
    volumes:
      - assurance-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/Development:${HOME}/Development:ro   # local-folder scan targets
    working_dir: ${PWD}

  # Public TLS front. Start with:
  #   DOMAIN=scan.example.com docker compose --profile public up -d
  # Caddy obtains/renews the Let's Encrypt certificate on first request.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./backend/resources/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  assurance-data:
  caddy-data:
  caddy-config:
