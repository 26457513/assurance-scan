# ---------------------------------------------------------------------------
# Assurance Scan — hosted stack (local parity with the cloud deployment).
#
#   Local:    docker compose up -d --build
#   Cloud:    same file on a VM (e.g. a DigitalOcean droplet with Docker);
#             put GITHUB_POLL_TOKEN / GITHUB_ORG in .env first.
#
# The DB is a single SQLite file inside the named volume — backup = copy it.
# The docker socket mount keeps local-folder scans working where a real
# docker daemon is present; omit it on hosts that shouldn't scan locally.
# ---------------------------------------------------------------------------
name: assurance-scan

services:
  server:
    build: .
    image: assurance-scan:app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8742:8000"   # loopback only; expose via tailscale/VPN or a proxy
    env_file: .env
    environment:
      ASSURANCE_SCAN_DB_PATH: /data/db.sqlite
    volumes:
      - assurance-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/Development:${HOME}/Development:ro   # local-folder scan targets
    working_dir: ${PWD}

volumes:
  assurance-data:
