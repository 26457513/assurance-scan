name: assurance-scan

on: [workflow_call]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Caller's code goes in target/ so the scanner checkout can't pollute
      # the scan with the scanner repo's own files.
      - uses: actions/checkout@v5
        with:
          path: target
      - uses: actions/checkout@v5
        with:
          repository: 26457513/assurance-scan
          ref: target-schema-implementation   # match caller's pin; switch to main at merge
          path: assurance-scan
          # Private cross-repo checkout: the caller's GITHUB_TOKEN can't read
          # sibling private repos. Callers pass the org secret via
          # `secrets: inherit` (fine-grained PAT, Contents: Read-only).
          token: ${{ secrets.ASSURANCE_SCAN_TOKEN }}
      - name: Build image (if Dockerfile present)
        if: hashFiles('target/Dockerfile') != ''
        run: docker build -t assurance-scan-target:ci target
        # Build failures degrade to a skipped image scan — ci-scan.py's
        # image guard handles the missing tag.
        continue-on-error: true
      - name: Run assurance-scan
        run: python3 assurance-scan/scripts/ci-scan.py target --sarif assurance.sarif --image assurance-scan-target:ci
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            assurance.sarif
            sbom.cyclonedx.json
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: assurance-scan
          path: summary.md
