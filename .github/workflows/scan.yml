name: assurance-scan

on: [workflow_call]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Caller's code goes in target/ so the scanner checkout can't pollute
      # the scan with the scanner repo's own files.
      - uses: actions/checkout@v5
        with:
          path: target
      - uses: actions/checkout@v5
        with:
          repository: 26457513/assurance-scan
          ref: main
          path: assurance-scan
          # Private cross-repo checkout: the caller's GITHUB_TOKEN can't read
          # sibling private repos. Callers pass the org secret via
          # `secrets: inherit` (fine-grained PAT, Contents: Read-only).
          token: ${{ secrets.ASSURANCE_SCAN_TOKEN }}
      - name: Set up buildx
        # type=gha cache export needs a container-driver builder; the runner's
        # default docker driver rejects cache backends.
        uses: docker/setup-buildx-action@v3
      - name: Build image (if Dockerfile present)
        if: hashFiles('target/Dockerfile') != ''
        uses: docker/build-push-action@v6
        env:
          # Suppress the action's own Step Summary block; the build record
          # still uploads (see Artifacts) — our summary documents it.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: target
          load: true
          tags: assurance-scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # Build failures degrade to a skipped image scan — ci-scan.py's
        # image guard handles the missing tag.
        continue-on-error: true
      - name: Run assurance-scan
        run: python3 assurance-scan/scripts/ci-scan.py target --sarif assurance.sarif --image assurance-scan-target:ci
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            assurance.sarif
            sbom.cyclonedx.json
            findings.json
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: assurance-scan
          path: summary.md
