name: assurance-scan

on: [workflow_call]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Caller's code goes in target/ so the scanner checkout can't pollute
      # the scan with the scanner repo's own files.
      - uses: actions/checkout@v5
        with:
          path: target
      - name: Set up buildx
        # type=gha cache export needs a container-driver builder; the runner's
        # default docker driver rejects cache backends.
        uses: docker/setup-buildx-action@v3
      - name: Build image (if Dockerfile present)
        if: hashFiles('target/Dockerfile') != ''
        uses: docker/build-push-action@v6
        env:
          # Suppress the action's own Step Summary block; the build record
          # still uploads (see Artifacts) — our summary documents it.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: target
          load: true
          tags: assurance-scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # Build failures degrade to a skipped image scan — ci-scan.py's
        # image guard handles the missing tag.
        continue-on-error: true
      # The scanner image is a private org package; the job token can pull
      # it, but only after an explicit docker login.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Same-path bind mount: scanner sibling containers mount from the
      # docker daemon host, so the project path inside this container must
      # equal its path on the runner.
      - name: Run assurance-scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/target:$PWD/target" \
            -w "$PWD/target" \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e ASSURANCE_SCAN_URL="${ASSURANCE_SCAN_URL:-https://scan.squease.ai}" \
            ghcr.io/26457513/assurance-scan-ci:latest \
            "$PWD/target" --sarif "$PWD/target/assurance.sarif" --image assurance-scan-target:ci
          cat "$PWD/target/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            target/assurance.sarif
            target/sbom.cyclonedx.json
            target/findings.json
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: assurance-scan
          path: target/summary.md
