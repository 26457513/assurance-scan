name: assurance-scan

on: [workflow_call]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: 26457513/assurance-scan
          ref: target-schema-implementation   # match caller's pin; switch to main at merge
          path: assurance-scan
          # Private cross-repo checkout: the caller's GITHUB_TOKEN can't read
          # sibling private repos. Callers pass the org secret via
          # `secrets: inherit` (fine-grained PAT, Contents: Read-only).
          token: ${{ secrets.ASSURANCE_SCAN_TOKEN }}
      - name: Build image (if Dockerfile present)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: assurance-scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # Build failures (incl. cache hiccups) degrade to a skipped image
        # scan — ci-scan.py's image guard handles the missing tag.
        continue-on-error: true
      - name: Run assurance-scan
        run: python3 assurance-scan/scripts/ci-scan.py . --sarif assurance.sarif --image assurance-scan-target:ci
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            assurance.sarif
            sbom.cyclonedx.json
