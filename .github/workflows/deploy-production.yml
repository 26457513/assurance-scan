name: deploy-production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, verify, or retrieve redacted production diagnostics
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - verify
          - diagnose
      revision:
        description: Full main-branch revision whose immutable application image will be deployed
        required: true
        type: string
      confirmation:
        description: Type deploy-production for a deploy or diagnose-production for diagnostics
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: root@165.232.106.224
  APP_IMAGE: ghcr.io/26457513/assurance-scan-app

jobs:
  prepare-backup:
    if: inputs.operation == 'deploy'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate immutable release input
        id: release
        env:
          REVISION: ${{ inputs.revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = deploy-production
          case "$REVISION" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#REVISION}" -eq 40
          git merge-base --is-ancestor "$REVISION" origin/main
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Configure production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 165.232.106.224 >> "$HOME/.ssh/known_hosts"
      - name: Validate and stage protected production configuration
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_ID: ${{ vars.APP_ID }}
          APP_SLUG: ${{ vars.APP_SLUG }}
          APP_PUBLIC_BASE_URL: ${{ vars.APP_PUBLIC_BASE_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_ADMIN_GITHUB_IDS: ${{ vars.APP_ADMIN_GITHUB_IDS }}
          APP_ACCESS_ENABLED: ${{ vars.APP_ACCESS_ENABLED }}
          APP_WEBHOOK_ENABLED: ${{ vars.APP_WEBHOOK_ENABLED }}
          APP_OIDC_INGEST_ENABLED: ${{ vars.APP_OIDC_INGEST_ENABLED }}
          APP_LOCAL_INGEST_ENABLED: ${{ vars.APP_LOCAL_INGEST_ENABLED }}
          APP_SCAN_TOKEN_CREATION_ENABLED: ${{ vars.APP_SCAN_TOKEN_CREATION_ENABLED }}
          APP_LOG_LEVEL: ${{ vars.APP_LOG_LEVEL }}
          APP_PARALLELISM: ${{ vars.APP_PARALLELISM }}
          APP_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
          APP_PRIVATE_KEY_B64: ${{ secrets.APP_PRIVATE_KEY_B64 }}
          APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          APP_TOKEN_ENCRYPTION_KEY: ${{ secrets.APP_TOKEN_ENCRYPTION_KEY }}
          APP_WEBHOOK_SECRET: ${{ secrets.APP_WEBHOOK_SECRET }}
          APP_MCP_TOKEN: ${{ secrets.APP_MCP_TOKEN }}
          ROLLOUT_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$APP_ACCESS_ENABLED" = true
          test "$APP_PUBLIC_BASE_URL" = https://scan.squease.ai
          test "$APP_DOMAIN" = scan.squease.ai
          test -n "$APP_CLIENT_ID"
          test -n "$APP_ID"
          test -n "$APP_SLUG"
          test -n "$APP_ADMIN_GITHUB_IDS"
          test -n "$APP_CLIENT_SECRET"
          test -n "$APP_PRIVATE_KEY_B64"
          test -n "$APP_SESSION_SECRET"
          test -n "$APP_TOKEN_ENCRYPTION_KEY"
          test -n "$APP_WEBHOOK_SECRET"
          case "$APP_ADMIN_GITHUB_IDS" in *[!0-9,]*|','*|*','|'') exit 2 ;; esac
          for flag in "$APP_WEBHOOK_ENABLED" "$APP_OIDC_INGEST_ENABLED" \
            "$APP_LOCAL_INGEST_ENABLED" "$APP_SCAN_TOKEN_CREATION_ENABLED"; do
            case "$flag" in true|false) ;; *) exit 2 ;; esac
          done
          runtime="$RUNNER_TEMP/assurance-scan-runtime"
          install -d -m 700 "$runtime/secrets"
          printf '%s' "$APP_PRIVATE_KEY_B64" | base64 --decode > "$runtime/secrets/github-app.pem"
          chmod 600 "$runtime/secrets/github-app.pem"
          openssl pkey -in "$runtime/secrets/github-app.pem" -check -noout >/dev/null
          {
            printf 'PUBLIC_BASE_URL=%s\n' "$APP_PUBLIC_BASE_URL"
            printf 'DOMAIN=%s\n' "$APP_DOMAIN"
            printf 'SESSION_SECRET=%s\n' "$APP_SESSION_SECRET"
            printf 'TOKEN_ENCRYPTION_KEY=%s\n' "$APP_TOKEN_ENCRYPTION_KEY"
            printf 'GITHUB_APP_ACCESS_ENABLED=%s\n' "$APP_ACCESS_ENABLED"
            printf 'GITHUB_APP_CLIENT_ID=%s\n' "$APP_CLIENT_ID"
            printf 'GITHUB_APP_CLIENT_SECRET=%s\n' "$APP_CLIENT_SECRET"
            printf 'GITHUB_APP_ID=%s\n' "$APP_ID"
            printf 'GITHUB_APP_SLUG=%s\n' "$APP_SLUG"
            printf 'GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/assurance-scan/github-app.pem\n'
            printf 'GITHUB_ADMIN_USER_IDS=%s\n' "$APP_ADMIN_GITHUB_IDS"
            printf 'GITHUB_WEBHOOK_ENABLED=%s\n' "$APP_WEBHOOK_ENABLED"
            printf 'GITHUB_WEBHOOK_SECRET=%s\n' "$APP_WEBHOOK_SECRET"
            printf 'GITHUB_OIDC_INGEST_ENABLED=%s\n' "$APP_OIDC_INGEST_ENABLED"
            printf 'LOCAL_INGEST_ENABLED=%s\n' "$APP_LOCAL_INGEST_ENABLED"
            printf 'SCAN_TOKEN_CREATION_ENABLED=%s\n' "$APP_SCAN_TOKEN_CREATION_ENABLED"
            printf 'ASSURANCE_SCAN_LOG_LEVEL=%s\n' "${APP_LOG_LEVEL:-INFO}"
            printf 'ASSURANCE_SCAN_PARALLELISM=%s\n' "${APP_PARALLELISM:-4}"
            printf 'MCP_TOKEN=%s\n' "$APP_MCP_TOKEN"
          } > "$runtime/app.env"
          chmod 600 "$runtime/app.env"
          ssh "$DEPLOY_HOST" "install -d -m 700 /root/assurance-scan-runtime/incoming-$ROLLOUT_ID"
          scp "$runtime/app.env" "$DEPLOY_HOST:/root/assurance-scan-runtime/incoming-$ROLLOUT_ID/app.env"
          scp -r "$runtime/secrets" "$DEPLOY_HOST:/root/assurance-scan-runtime/incoming-$ROLLOUT_ID/"
          ssh "$DEPLOY_HOST" bash -s -- "$ROLLOUT_ID" <<'REMOTE'
          set -Eeuo pipefail
          set +x
          umask 077
          rollout_id="$1"
          root=/root/assurance-scan-runtime
          incoming="$root/incoming-$rollout_id"
          release="$root/release-$rollout_id"
          test -f "$incoming/app.env"
          test -f "$incoming/secrets/github-app.pem"
          test "$(stat -c '%a' "$incoming/app.env")" = 600
          test "$(stat -c '%a' "$incoming/secrets/github-app.pem")" = 600
          test ! -e "$release"
          mv "$incoming" "$release"
          REMOTE
      - name: Stop writers, preflight, and create verified backup
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          ROLLOUT_ID: ${{ github.run_id }}
        run: |
          ssh "$DEPLOY_HOST" bash -s -- "$REVISION" "$ROLLOUT_ID" <<'REMOTE'
          set -Eeuo pipefail
          set +x
          umask 077

          revision="$1"
          rollout_id="$2"
          case "$revision" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#revision}" -eq 40
          case "$rollout_id" in
            *[!0-9]*|'') exit 2 ;;
          esac

          repository=/root/assurance-scan
          runtime="/root/assurance-scan-runtime/release-$rollout_id"
          candidate_ref="ghcr.io/26457513/assurance-scan-app:sha-$revision"
          evidence_dir="/root/assurance-scan-backups/cutover-$revision-$rollout_id"
          cutover_tool=/opt/assurance-scan/backend/scripts/local-cutover.py
          server_stopped=0

          restart_previous_on_error() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$server_stopped" -eq 1 ]; then
              cd "$repository"
              if test -r /root/assurance-scan-runtime/current/app.env; then
                ASSURANCE_SCAN_ENV_FILE=/root/assurance-scan-runtime/current/app.env \
                  ASSURANCE_SCAN_SECRETS_DIR=/root/assurance-scan-runtime/current/secrets \
                  DOMAIN=scan.squease.ai \
                  docker compose up -d --no-deps --pull never --no-build server || true
              else
                docker compose up -d --no-deps --pull never --no-build server || true
              fi
            fi
            exit "$status"
          }
          trap restart_previous_on_error EXIT

          cd "$repository"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$revision" origin/main
          git checkout --quiet main
          git merge --ff-only "$revision"
          test -r "$runtime/app.env"
          test -r "$runtime/secrets/github-app.pem"

          docker pull --quiet "$candidate_ref" >/dev/null
          test "$(docker image inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$revision"
          previous_image_id="$(docker inspect assurance-scan-server-1 --format '{{.Image}}')"
          data_volume="$(docker inspect assurance-scan-server-1 --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          test -n "$data_volume"
          docker volume inspect "$data_volume" >/dev/null
          test ! -e "$evidence_dir"
          install -d -m 700 "$evidence_dir"

          ASSURANCE_SCAN_ENV_FILE="$runtime/app.env" \
            ASSURANCE_SCAN_SECRETS_DIR="$runtime/secrets" DOMAIN=scan.squease.ai \
            docker compose stop server
          server_stopped=1
          test -z "$(ASSURANCE_SCAN_ENV_FILE="$runtime/app.env" \
            ASSURANCE_SCAN_SECRETS_DIR="$runtime/secrets" DOMAIN=scan.squease.ai \
            docker compose ps --status running -q server)"

          docker run --rm \
            -v "$data_volume:/data" \
            --entrypoint /opt/venv/bin/python "$candidate_ref" \
            -c 'import json, sqlite3; connection = sqlite3.connect("/data/db.sqlite"); result = connection.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone(); connection.close(); assert result and result[0] == 0, result; print(json.dumps({"busy": result[0], "log_frames": result[1], "checkpointed_frames": result[2]}))' \
            > "$evidence_dir/wal-checkpoint.json"

          docker run --rm --read-only \
            -v "$data_volume:/data:ro" \
            -v "$evidence_dir:/evidence" \
            --entrypoint /opt/venv/bin/python "$candidate_ref" \
            "$cutover_tool" preflight --database /data/db.sqlite \
            > "$evidence_dir/cutover-preflight.json"

          docker run --rm --read-only \
            -v "$data_volume:/data:ro" \
            -v "$evidence_dir:/evidence" \
            --entrypoint /opt/venv/bin/python "$candidate_ref" \
            "$cutover_tool" backup \
            --database /data/db.sqlite \
            --backup /evidence/db.sqlite.pre-cutover \
            --manifest /evidence/db.sqlite.pre-cutover.json \
            --application-revision "$previous_image_id" \
            > "$evidence_dir/backup-create-report.json"

          docker run --rm --read-only \
            -v "$evidence_dir:/evidence:ro" \
            --entrypoint /opt/venv/bin/python "$candidate_ref" \
            "$cutover_tool" verify-backup \
            --backup /evidence/db.sqlite.pre-cutover \
            --manifest /evidence/db.sqlite.pre-cutover.json \
            > "$evidence_dir/backup-verify-report.json"

          printf '%s\n' "$previous_image_id" > "$evidence_dir/previous-image-id.txt"
          chmod 600 "$evidence_dir"/*
          trap - EXIT
          REMOTE
      - name: Copy verified backup to the private runner
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          ROLLOUT_ID: ${{ github.run_id }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/production-backup"
          scp -r "$DEPLOY_HOST:/root/assurance-scan-backups/cutover-$REVISION-$ROLLOUT_ID/." \
            "$RUNNER_TEMP/production-backup/"
      - name: Preserve encrypted-at-rest off-host backup
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: production-backup-${{ steps.release.outputs.revision }}-${{ github.run_id }}
          path: ${{ runner.temp }}/production-backup
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner backup copy
        if: always()
        run: find "$RUNNER_TEMP/production-backup" -type f -delete 2>/dev/null || true
      - name: Restart previous service when preparation or off-host backup fails
        if: failure()
        run: |
          ssh "$DEPLOY_HOST" 'cd /root/assurance-scan &&
            if test -r /root/assurance-scan-runtime/current/app.env; then
              ASSURANCE_SCAN_ENV_FILE=/root/assurance-scan-runtime/current/app.env \
              ASSURANCE_SCAN_SECRETS_DIR=/root/assurance-scan-runtime/current/secrets \
              DOMAIN=scan.squease.ai \
              docker compose up -d --no-deps --pull never --no-build server;
            else
              docker compose up -d --no-deps --pull never --no-build server;
            fi'

  deploy:
    if: inputs.operation == 'deploy'
    needs: prepare-backup
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 165.232.106.224 >> "$HOME/.ssh/known_hosts"
      - name: Migrate and deploy the immutable application image
        env:
          REVISION: ${{ needs.prepare-backup.outputs.revision }}
          ROLLOUT_ID: ${{ github.run_id }}
        run: |
          ssh "$DEPLOY_HOST" bash -s -- "$REVISION" "$ROLLOUT_ID" <<'REMOTE'
          set -Eeuo pipefail
          set +x

          revision="$1"
          rollout_id="$2"
          repository=/root/assurance-scan
          runtime="/root/assurance-scan-runtime/release-$rollout_id"
          candidate_ref="ghcr.io/26457513/assurance-scan-app:sha-$revision"
          evidence_dir="/root/assurance-scan-backups/cutover-$revision-$rollout_id"

          cd "$repository"
          test "$(git rev-parse HEAD)" = "$revision"
          test -z "$(ASSURANCE_SCAN_ENV_FILE="$runtime/app.env" \
            ASSURANCE_SCAN_SECRETS_DIR="$runtime/secrets" DOMAIN=scan.squease.ai \
            docker compose ps --status running -q server)"
          test -r "$evidence_dir/db.sqlite.pre-cutover"
          test -r "$evidence_dir/db.sqlite.pre-cutover.json"
          data_volume="$(docker inspect assurance-scan-server-1 --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          test -n "$data_volume"
          docker volume inspect "$data_volume" >/dev/null

          docker run --rm \
            --env-file "$runtime/app.env" \
            -e ASSURANCE_SCAN_DB_PATH=/data/db.sqlite \
            -v "$data_volume:/data" \
            -w /opt/assurance-scan/backend \
            --entrypoint /opt/venv/bin/alembic "$candidate_ref" \
            -c /opt/assurance-scan/backend/alembic.ini upgrade head

          docker image tag "$candidate_ref" ghcr.io/26457513/assurance-scan-app:latest
          # The former unattended updater conflicts with immutable, backed-up
          # releases and can silently replace a verified container at the next
          # five-minute boundary. Preserve unrelated root cron entries.
          crontab -l 2>/dev/null \
            | awk '!/cd \/root\/assurance-scan && docker compose pull -q server/' \
            | crontab -
          ln -sfn "$runtime" /root/assurance-scan-runtime/current.next
          mv -Tf /root/assurance-scan-runtime/current.next /root/assurance-scan-runtime/current
          candidate_override="$runtime/compose.candidate.yml"
          printf 'services:\n  server:\n    image: %s\n' "$candidate_ref" > "$candidate_override"
          chmod 600 "$candidate_override"
          ASSURANCE_SCAN_ENV_FILE="$runtime/app.env" \
            ASSURANCE_SCAN_SECRETS_DIR="$runtime/secrets" DOMAIN=scan.squease.ai \
            docker compose -f compose.yaml -f "$candidate_override" \
              up -d --no-deps --pull never --no-build --force-recreate server

          healthy=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --retry-connrefused \
              http://127.0.0.1:8742/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          test "$(docker inspect assurance-scan-server-1 --format '{{.Config.Image}}')" = \
            "$candidate_ref"
          test "$(docker inspect assurance-scan-server-1 --format '{{.Image}}')" = \
            "$(docker image inspect "$candidate_ref" --format '{{.Id}}')"
          docker exec assurance-scan-server-1 \
            /opt/venv/bin/python -c 'import os, sqlite3; connection=sqlite3.connect(os.environ["ASSURANCE_SCAN_DB_PATH"]); row=connection.execute("SELECT version_num FROM alembic_version").fetchone(); connection.close(); assert row == ("0038_github_signin_return_paths",), row'
          # Re-resolve the recreated server container's Docker-network address.
          # Caddy can retain the previous address and otherwise return 502 even
          # though the replacement application is healthy on the host port.
          ASSURANCE_SCAN_ENV_FILE="$runtime/app.env" \
            ASSURANCE_SCAN_SECRETS_DIR="$runtime/secrets" DOMAIN=scan.squease.ai \
            docker compose restart caddy
          REMOTE
      - name: Remove runner configuration copy
        if: always()
        run: find "$RUNNER_TEMP/assurance-scan-runtime" -type f -delete 2>/dev/null || true
      - name: Verify the public health endpoint
        run: >-
          curl --fail --silent --show-error --retry 10 --retry-delay 2
          --retry-all-errors --retry-max-time 60 https://scan.squease.ai/health

  verify:
    if: inputs.operation == 'verify'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate immutable release input
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          case "$REVISION" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#REVISION}" -eq 40
          git merge-base --is-ancestor "$REVISION" origin/main
      - name: Configure production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 165.232.106.224 >> "$HOME/.ssh/known_hosts"
      - name: Verify running image, schema, and local health
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          ssh "$DEPLOY_HOST" bash -s -- "$REVISION" <<'REMOTE'
          set -Eeuo pipefail
          revision="$1"
          cd /root/assurance-scan
          candidate_ref="ghcr.io/26457513/assurance-scan-app:sha-$revision"
          container_status="$(docker inspect assurance-scan-server-1 --format '{{.State.Status}}')"
          configured_image="$(docker inspect assurance-scan-server-1 --format '{{.Config.Image}}')"
          running_image_id="$(docker inspect assurance-scan-server-1 --format '{{.Image}}')"
          candidate_image_id="$(docker image inspect "$candidate_ref" --format '{{.Id}}' 2>/dev/null || true)"
          latest_image_id="$(docker image inspect ghcr.io/26457513/assurance-scan-app:latest --format '{{.Id}}' 2>/dev/null || true)"
          created_at="$(docker inspect assurance-scan-server-1 --format '{{.Created}}')"
          printf 'container_status=%s\nconfigured_image=%s\nrunning_image_id=%s\n' \
            "$container_status" "$configured_image" "$running_image_id"
          printf 'candidate_image_id=%s\nlatest_image_id=%s\ncreated_at=%s\n' \
            "$candidate_image_id" "$latest_image_id" "$created_at"
          if [ "$container_status" != running ]; then
            docker ps -a --format 'container={{.Names}} image={{.Image}} status={{.Status}} created={{.CreatedAt}}' >&2
            printf '%s\n' '--- root crontab ---' >&2
            crontab -l >&2 2>/dev/null || true
            printf '%s\n' '--- system timers ---' >&2
            systemctl list-timers --all --no-pager >&2 2>/dev/null || true
            printf '%s\n' '--- deployment automation references ---' >&2
            grep -R -n -E 'docker (compose|pull)|assurance-scan' \
              /etc/cron.d /etc/systemd/system >&2 2>/dev/null || true
            docker inspect assurance-scan-server-1 \
              --format 'status={{.State.Status}} restarting={{.State.Restarting}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}} error={{json .State.Error}}' >&2
            docker logs --tail 80 assurance-scan-server-1 >&2
            exit 1
          fi
          docker pull --quiet "$candidate_ref" >/dev/null
          restart_count="$(docker inspect assurance-scan-server-1 --format '{{.RestartCount}}')"
          candidate_image_id="$(docker image inspect "$candidate_ref" --format '{{.Id}}')"
          printf 'restart_count=%s\nrunning_image_id=%s\ncandidate_image_id=%s\n' \
            "$restart_count" "$running_image_id" "$candidate_image_id"
          set +e
          schema_revision="$(docker exec assurance-scan-server-1 \
            /opt/venv/bin/python -c 'import os, sqlite3; connection=sqlite3.connect(os.environ["ASSURANCE_SCAN_DB_PATH"]); row=connection.execute("SELECT version_num FROM alembic_version").fetchone(); connection.close(); print(row[0] if row else "missing")' 2>&1)"
          schema_status=$?
          set -e
          printf 'schema_command_status=%s\nschema_revision=%s\n' "$schema_status" "$schema_revision"
          if [ "$schema_status" -ne 0 ]; then
            docker inspect assurance-scan-server-1 \
              --format 'status={{.State.Status}} restarting={{.State.Restarting}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}} error={{json .State.Error}}' >&2
            docker logs --tail 80 assurance-scan-server-1 >&2
            exit 1
          fi
          test "$running_image_id" = "$candidate_image_id"
          test "$schema_revision" = 0038_github_signin_return_paths
          curl --fail --silent --show-error http://127.0.0.1:8742/health >/dev/null
          oauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:8742/auth/github/start?next=%2Fprojects%2F1')"
          printf 'oauth_start_status=%s\n' "$oauth_status"
          if [ "$oauth_status" != 302 ]; then
            docker logs --tail 120 assurance-scan-server-1 >&2
            exit 1
          fi
          public_oauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            'https://scan.squease.ai/auth/github/start?next=%2Fprojects%2F1')"
          printf 'public_oauth_start_status=%s\n' "$public_oauth_status"
          if [ "$public_oauth_status" != 302 ]; then
            docker logs --tail 120 assurance-scan-server-1 >&2
            exit 1
          fi
          sleep 10
          final_restart_count="$(docker inspect assurance-scan-server-1 --format '{{.RestartCount}}')"
          printf 'final_restart_count=%s\n' "$final_restart_count"
          test "$final_restart_count" = "$restart_count"
          REMOTE
      - name: Verify the public health endpoint
        run: >-
          curl --fail --silent --show-error --retry 10 --retry-delay 2
          --retry-all-errors --retry-max-time 60 https://scan.squease.ai/health

  diagnose:
    if: inputs.operation == 'diagnose'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate diagnostic request
        env:
          REVISION: ${{ inputs.revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = diagnose-production
          case "$REVISION" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#REVISION}" -eq 40
          git merge-base --is-ancestor "$REVISION" origin/main
      - name: Configure production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 165.232.106.224 >> "$HOME/.ssh/known_hosts"
      - name: Retrieve redacted application diagnostics
        run: |
          ssh "$DEPLOY_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          printf '%s\n' '--- container state ---'
          docker inspect assurance-scan-server-1 \
            --format 'status={{.State.Status}} restart_count={{.RestartCount}} created={{.Created}} image={{.Config.Image}}'
          printf '%s\n' '--- redacted recent application errors ---'
          docker logs --since 30m --tail 1000 assurance-scan-server-1 2>&1 \
            | sed -E 's#"(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD) [^ ]+ HTTP/[0-9.]+"#"\1 [redacted-request] HTTP"#g' \
            | sed -E 's#(code|state|token|secret)=([^&[:space:]]+)#\1=[redacted]#g' \
            | tail -n 500
          REMOTE
