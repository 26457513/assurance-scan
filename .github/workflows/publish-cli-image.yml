name: publish-cli-image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      promotion_mode:
        description: "Promote current canary, or restore a previously qualified immutable release"
        required: true
        default: promote_canary
        type: choice
        options:
          - promote_canary
          - rollback_previous
      source_digest:
        description: "Previously built and signed sha256 digest to promote"
        required: true
        type: string
      source_version:
        description: "Immutable v<semver> tag already referring to source_digest"
        required: true
        type: string
      automated_evidence_url:
        description: "Successful tag-build Actions run URL for this exact version"
        required: true
        type: string
      macos_evidence_url:
        description: "Sanitized GitHub evidence URL for the qualified macOS canary run"
        required: true
        type: string
      linux_evidence_url:
        description: "Sanitized GitHub evidence URL for the qualified Linux canary run"
        required: true
        type: string
      previous_stable_digest:
        description: "Current stable sha256 digest, or 'none' for the first promotion"
        required: true
        type: string
      qualification_complete:
        description: "Confirm canary evidence was reviewed and rollback is ready"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/26457513/assurance-scan-cli

concurrency:
  group: publish-cli-image
  cancel-in-progress: false

jobs:
  quality-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.18.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend quality dependencies
        run: python -m pip install --requirement backend/requirements/dev.txt
      - name: Run the release quality gate
        env:
          QUALITY_GATE_PYTHON: python
        run: backend/scripts/quality-gate.sh

  build-release:
    if: github.event_name == 'push'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require a canonical immutable release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every pinned scanner index has both qualified platforms
        run: |
          python -c 'import json; data=json.load(open("backend/resources/scanners/release-set.v1.json")); print("\n".join(dict.fromkeys(item["image"] for item in data["scanners"])))' > scanner-images.txt
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image" > scanner-manifest.txt
            grep -q 'linux/amd64' scanner-manifest.txt
            grep -q 'linux/arm64' scanner-manifest.txt
          done < scanner-images.txt
      - name: Build, attest, and push immutable multi-architecture release
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.4
      - name: Keyless-sign the tested index digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify public pull, both platform manifests, signature and attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Manifest}}' > manifest.json
          python -c 'import json; data=json.load(open("manifest.json")); platforms={(item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture")) for item in data.get("manifests", [])}; required={("linux", "amd64"), ("linux", "arm64")}; missing=required - platforms; assert not missing, f"missing release platforms: {sorted(missing)}"'
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for platform in linux/amd64 linux/arm64; do
            artifact_suffix=${platform//\//-}
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "sbom-$artifact_suffix.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .Provenance \"$platform\").SLSA }}" > "provenance-$artifact_suffix.json"
            python - \
              "sbom-$artifact_suffix.json" \
              "provenance-$artifact_suffix.json" \
              "$GITHUB_SHA" \
              "$GITHUB_REF_NAME" \
              "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          import sys

          sbom_path, provenance_path, expected_sha, expected_version, expected_builder = sys.argv[1:]
          with open(sbom_path, encoding="utf-8") as stream:
              sbom = json.load(stream)
          assert sbom.get("SPDXID") == "SPDXRef-DOCUMENT", "invalid SPDX SBOM"
          assert sbom.get("packages"), "SPDX SBOM contains no packages"

          with open(provenance_path, encoding="utf-8") as stream:
              provenance = json.load(stream)
          definition = provenance.get("buildDefinition", {})
          request_args = definition.get("externalParameters", {}).get("request", {}).get("args", {})
          builder = provenance.get("runDetails", {}).get("builder", {}).get("id")
          assert definition.get("buildType"), "SLSA provenance has no build type"
          assert request_args.get("build-arg:REVISION") == expected_sha, "provenance revision mismatch"
          assert request_args.get("build-arg:VERSION") == expected_version, "provenance version mismatch"
          assert builder == expected_builder, "provenance builder mismatch"
          PY
          done
      - name: Create and keyless-sign the bounded release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - "$GITHUB_REF_NAME" "$DIGEST" > cli-release.json <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          version, digest = sys.argv[1:]
          published = datetime.now(timezone.utc).replace(microsecond=0)
          document = {
              "schema_version": 1,
              "wrapper_min_version": 1,
              "cli_version": version,
              "image": "ghcr.io/26457513/assurance-scan-cli",
              "oci_index_digest": digest,
              "supported_platforms": ["linux/amd64", "linux/arm64"],
              "signature_identity": (
                  "https://github.com/26457513/assurance-scan/"
                  ".github/workflows/publish-cli-image.yml@refs/tags/" + version
              ),
              "signature_issuer": "https://token.actions.githubusercontent.com",
              "published_at": published.isoformat().replace("+00:00", "Z"),
              "expires_at": (published + timedelta(days=7)).isoformat().replace("+00:00", "Z"),
          }
          json.dump(document, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY
          cosign sign-blob --yes --new-bundle-format \
            --bundle cli-release.sigstore.json cli-release.json
          cosign verify-blob \
            --bundle cli-release.sigstore.json \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            cli-release.json
      - name: Publish signed release metadata for deployment
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cli-release-${{ github.ref_name }}
          path: |
            cli-release.json
            cli-release.sigstore.json
          if-no-files-found: error
          retention-days: 30
      - name: Smoke both qualified architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            platform_digest=$(python -c 'import json, sys; data=json.load(open("manifest.json")); os_name, architecture=sys.argv[1].split("/"); print(next(item["digest"] for item in data["manifests"] if item.get("platform", {}).get("os") == os_name and item.get("platform", {}).get("architecture") == architecture))' "$platform")
            test "$(docker run --rm --platform "$platform" "$IMAGE@$platform_digest" --version)" = "assurance-scan $GITHUB_REF_NAME"
            docker run --rm --platform "$platform" --entrypoint python3 \
              "$IMAGE@$platform_digest" -c \
              'import hashlib; from app.modules.atomic.scanning.scanner_catalog import SCANNER_RELEASE_SET, SEMGREP_POLICY_PATH; payload=SEMGREP_POLICY_PATH.read_bytes(); assert hashlib.sha256(payload).hexdigest() == SCANNER_RELEASE_SET.semgrep_policy_sha256'
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move canary to the fully verified digest without rebuilding
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:canary" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:canary" --format '{{.Manifest.Digest}}')" = "$DIGEST"
      - name: Record candidate evidence summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### CLI canary candidate\n\n'
            printf -- '- Version: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Immutable index: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Canary equality, public pull, signature, SBOM/provenance, and architecture smokes: passed\n'
            printf -- '- Stable was not changed by this tag build.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    environment: cli-stable
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.4
      - name: Require reviewed canary evidence and unchanged stable baseline
        env:
          ACKNOWLEDGED: ${{ inputs.qualification_complete }}
          AUTOMATED_EVIDENCE_URL: ${{ inputs.automated_evidence_url }}
          MACOS_EVIDENCE_URL: ${{ inputs.macos_evidence_url }}
          LINUX_EVIDENCE_URL: ${{ inputs.linux_evidence_url }}
          EXPECTED_PREVIOUS: ${{ inputs.previous_stable_digest }}
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
          MODE: ${{ inputs.promotion_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$ACKNOWLEDGED" = "true"
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$AUTOMATED_EVIDENCE_URL" =~ ^https://github\.com/26457513/assurance-scan/actions/runs/[0-9]+$ ]]
          valid_manual_evidence_url() {
            [[ "$1" =~ ^https://github\.com/26457513/assurance-scan/(actions/runs/[0-9]+|issues/[0-9]+(#issuecomment-[0-9]+)?)$ ]]
          }
          valid_manual_evidence_url "$MACOS_EVIDENCE_URL"
          valid_manual_evidence_url "$LINUX_EVIDENCE_URL"
          test "$MACOS_EVIDENCE_URL" != "$LINUX_EVIDENCE_URL"

          run_id="${AUTOMATED_EVIDENCE_URL##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/26457513/assurance-scan/actions/runs/$run_id" --jq .conclusion)" = "success"
          test "$(gh api "repos/26457513/assurance-scan/actions/runs/$run_id" --jq '.path | startswith(".github/workflows/publish-cli-image.yml")')" = "true"
          test "$(gh api "repos/26457513/assurance-scan/actions/runs/$run_id" --jq .event)" = "push"
          test "$(gh api "repos/26457513/assurance-scan/actions/runs/$run_id" --jq .head_sha)" = \
            "$(gh api "repos/26457513/assurance-scan/commits/$VERSION" --jq .sha)"

          if [[ "$EXPECTED_PREVIOUS" != "none" ]]; then
            case "$EXPECTED_PREVIOUS" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          fi
          if current="$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            test "$EXPECTED_PREVIOUS" != "none"
            test "$current" = "$EXPECTED_PREVIOUS"
          else
            test "$EXPECTED_PREVIOUS" = "none"
          fi
          if [[ "$MODE" = "promote_canary" ]]; then
            test "$(docker buildx imagetools inspect "$IMAGE:canary" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          else
            test "$MODE" = "rollback_previous"
            test "$EXPECTED_PREVIOUS" != "$DIGEST"
          fi
      - name: Validate immutable source release
        env:
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
        run: |
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for platform in linux/amd64 linux/arm64; do
            artifact_suffix=${platform//\//-}
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "sbom-$artifact_suffix.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .Provenance \"$platform\").SLSA }}" > "provenance-$artifact_suffix.json"
            python - "sbom-$artifact_suffix.json" "provenance-$artifact_suffix.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              sbom = json.load(stream)
          assert sbom.get("SPDXID") == "SPDXRef-DOCUMENT", "invalid SPDX SBOM"
          assert sbom.get("packages"), "SPDX SBOM contains no packages"

          with open(sys.argv[2], encoding="utf-8") as stream:
              provenance = json.load(stream)
          assert provenance.get("buildDefinition", {}).get("buildType"), "invalid SLSA provenance"
          assert provenance.get("runDetails", {}).get("builder", {}).get("id"), "provenance builder missing"
          PY
          done
      - name: Verify signed metadata from the qualified tag run
        env:
          AUTOMATED_EVIDENCE_URL: ${{ inputs.automated_evidence_url }}
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${AUTOMATED_EVIDENCE_URL##*/}"
          mkdir cli-release-evidence
          gh run download "$run_id" --name "cli-release-$VERSION" --dir cli-release-evidence
          cosign verify-blob \
            --bundle cli-release-evidence/cli-release.sigstore.json \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            cli-release-evidence/cli-release.json
          python - "$VERSION" "$DIGEST" <<'PY'
          import json
          import sys

          version, digest = sys.argv[1:]
          with open("cli-release-evidence/cli-release.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["cli_version"] == version, "release manifest version mismatch"
          assert manifest["oci_index_digest"] == digest, "release manifest digest mismatch"
          assert manifest["image"] == "ghcr.io/26457513/assurance-scan-cli", "release manifest image mismatch"
          PY
      - name: Move latest and stable to the tested digest without rebuilding
        env:
          DIGEST: ${{ inputs.source_digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"
      - name: Verify stable is publicly retrievable and still has release evidence
        env:
          DIGEST: ${{ inputs.source_digest }}
        run: |
          docker logout ghcr.io
          test "$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for platform in linux/amd64 linux/arm64; do
            artifact_suffix=${platform//\//-}
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .SBOM \"$platform\").SPDX }}" > "stable-sbom-$artifact_suffix.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .Provenance \"$platform\").SLSA }}" > "stable-provenance-$artifact_suffix.json"
            python - "stable-sbom-$artifact_suffix.json" "stable-provenance-$artifact_suffix.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              sbom = json.load(stream)
          assert sbom.get("SPDXID") == "SPDXRef-DOCUMENT", "invalid SPDX SBOM"
          assert sbom.get("packages"), "SPDX SBOM contains no packages"

          with open(sys.argv[2], encoding="utf-8") as stream:
              provenance = json.load(stream)
          assert provenance.get("buildDefinition", {}).get("buildType"), "invalid SLSA provenance"
          assert provenance.get("runDetails", {}).get("builder", {}).get("id"), "provenance builder missing"
          PY
          done
      - name: Record stable promotion summary
        env:
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
          PREVIOUS: ${{ inputs.previous_stable_digest }}
          MODE: ${{ inputs.promotion_mode }}
        run: |
          {
            printf '### CLI stable promotion\n\n'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Stable digest: `%s`\n' "$DIGEST"
            printf -- '- Previous stable digest: `%s`\n' "$PREVIOUS"
            printf -- '- Operation: `%s`\n' "$MODE"
            printf -- '- Stable/source equality and public release-evidence verification: passed\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-release-metadata:
    if: github.event_name == 'workflow_dispatch'
    needs: promote-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment: production
    env:
      DEPLOY_HOST: root@165.232.106.224
    steps:
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v2.6.4
      - name: Download and independently verify qualified release metadata
        env:
          AUTOMATED_EVIDENCE_URL: ${{ inputs.automated_evidence_url }}
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_id="${AUTOMATED_EVIDENCE_URL##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          install -d -m 700 cli-release-evidence
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "cli-release-$VERSION" --dir cli-release-evidence
          cosign verify-blob \
            --bundle cli-release-evidence/cli-release.sigstore.json \
            --certificate-identity-regexp '^https://github.com/26457513/assurance-scan/.github/workflows/publish-cli-image.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            cli-release-evidence/cli-release.json
          python - "$VERSION" "$DIGEST" <<'PY'
          import json
          import sys

          version, digest = sys.argv[1:]
          with open("cli-release-evidence/cli-release.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["cli_version"] == version, "release manifest version mismatch"
          assert manifest["oci_index_digest"] == digest, "release manifest digest mismatch"
          assert manifest["image"] == "ghcr.io/26457513/assurance-scan-cli", "release manifest image mismatch"
          PY
      - name: Configure production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 165.232.106.224 >> "$HOME/.ssh/known_hosts"
      - name: Atomically install metadata and restart the API
        env:
          ROLLOUT_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          set +x
          remote_stage="/root/assurance-scan-cli-release/incoming-$ROLLOUT_ID"
          ssh "$DEPLOY_HOST" "install -d -m 700 '$remote_stage'"
          scp cli-release-evidence/cli-release.json \
            "$DEPLOY_HOST:$remote_stage/latest.json"
          scp cli-release-evidence/cli-release.sigstore.json \
            "$DEPLOY_HOST:$remote_stage/latest.sigstore.json"
          ssh "$DEPLOY_HOST" bash -s -- "$ROLLOUT_ID" <<'REMOTE'
          set -Eeuo pipefail
          set +x
          rollout_id="$1"
          case "$rollout_id" in *[!0-9]*|'') exit 2 ;; esac
          stage="/root/assurance-scan-cli-release/incoming-$rollout_id"
          test -s "$stage/latest.json"
          test -s "$stage/latest.sigstore.json"
          container=assurance-scan-server-1
          data_volume="$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          test -n "$data_volume"
          data_root="$(docker volume inspect "$data_volume" --format '{{.Mountpoint}}')"
          test -d "$data_root"
          target="$data_root/cli-release"
          # These signed files are intentionally public and the application
          # may run as a non-root UID. Keep the containing volume writable only
          # by root while allowing the API process to read release metadata.
          install -d -m 755 "$target"
          install -m 644 "$stage/latest.sigstore.json" "$target/latest.sigstore.json.new"
          install -m 644 "$stage/latest.json" "$target/latest.json.new"
          mv "$target/latest.sigstore.json.new" "$target/latest.sigstore.json"
          mv "$target/latest.json.new" "$target/latest.json"
          rm -f "$stage/latest.json" "$stage/latest.sigstore.json"
          rmdir "$stage"
          docker restart "$container" >/dev/null
          REMOTE
      - name: Verify public release endpoints match the promoted release
        env:
          DIGEST: ${{ inputs.source_digest }}
          VERSION: ${{ inputs.source_version }}
        run: |
          set -Eeuo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              https://scan.squease.ai/api/v2/cli/releases/latest \
              --output deployed-release.json; then
              break
            fi
            sleep 5
          done
          curl --fail --silent --show-error \
            https://scan.squease.ai/api/v2/cli/releases/latest.sigstore.json \
            --output deployed-release.sigstore.json
          python - "$VERSION" "$DIGEST" <<'PY'
          import json
          import sys

          version, digest = sys.argv[1:]
          with open("deployed-release.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["cli_version"] == version, "deployed release version mismatch"
          assert manifest["oci_index_digest"] == digest, "deployed release digest mismatch"
          with open("deployed-release.sigstore.json", encoding="utf-8") as stream:
              bundle = json.load(stream)
          assert isinstance(bundle, dict) and bundle, "deployed signature bundle is empty"
          PY
