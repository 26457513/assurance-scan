name: assurance-scan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  # Self-scans run AFTER the image publish so they always test the freshly
  # published orchestrator image (no publish/scan race on the same push).
  workflow_run:
    workflows: [publish-ci-image]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write        # build layer cache
  pull-requests: write  # assurance-scan PR comment

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (if Dockerfile present)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          load: true
          tags: assurance-scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
      - name: Run assurance-scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e ASSURANCE_SCAN_URL=https://scan.squease.ai \
            ghcr.io/26457513/assurance-scan-ci:latest \
            "$PWD" --sarif "$PWD/assurance.sarif" --image assurance-scan-target:ci
          cat "$PWD/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            assurance.sarif
            sbom.cyclonedx.json
            findings.json
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: assurance-scan
          path: summary.md
