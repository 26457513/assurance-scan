name: assurance-scan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  # Self-scans run AFTER the image publish so they always test the freshly
  # published orchestrator image (no publish/scan race on the same push).
  workflow_run:
    workflows: [publish-ci-image]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write        # build layer cache
  pull-requests: write  # assurance-scan PR comment

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: 26457513/assurance-scan-ci/.github/workflows/scan.yml@f4fd920d4be46284cc44091f9d0146a14faea397
