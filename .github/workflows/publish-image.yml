name: publish-image

# Builds the asvs-scanner Docker image for linux/amd64 + linux/arm64.
#
# Two jobs:
#   - validate: runs on PRs. Builds both arches but never pushes. Cache via
#     GitHub Actions cache (repository-scoped, not visible on Docker Hub).
#   - publish:  runs on push to main, on v* tags, and on manual dispatch.
#     Pushes to Docker Hub.
#
# Tags produced by `publish`:
#   - <user>/asvs-scanner:<short-sha>   on every publish (always)
#   - <user>/asvs-scanner:latest        on every push to main
#   - <user>/asvs-scanner:<version>     on git tag v* (e.g. v1.2.3 -> 1.2.3)
#   - <user>/asvs-scanner:stable        on git tag v* (only advanced on releases)
#
# Use :stable for teams that want to pin and update deliberately.
# Use :latest for teams that want every main push.
# Use :<short-sha> or :<version> for reproducible pinned deployments.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account with push access to the image repo
#   DOCKERHUB_TOKEN     Personal access token (account settings -> Security)
#
# The image repo on Docker Hub must already exist (create it as private first
# via hub.docker.com, or this workflow will fail on push).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:        # manual trigger from the Actions tab

jobs:
  validate:
    name: Build (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build and push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          set -eu
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/asvs-scanner"
          TAGS="$REPO:${GITHUB_SHA::8}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,$REPO:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS,$REPO:$VERSION,$REPO:stable"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
