name: publish-ci-image

on:
  push:
    branches: [main]
    paths:
      - backend/Dockerfile.ci
      - backend/scripts/ci-scan.py
      - backend/app/worker/**
      - backend/app/modules/**
      - .github/workflows/publish-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/26457513/assurance-scan-ci
          docker build -f backend/Dockerfile.ci -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::12}"
