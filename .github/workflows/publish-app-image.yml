name: publish-app-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - frontend/**
      - backend/app/**
      - backend/resources/**
      - backend/scripts/**
      - backend/bin/**
      - backend/requirements/server.txt
      - backend/alembic.ini
      - docker-compose.security.yml
      - compose.yaml
      - .github/workflows/publish-app-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/26457513/assurance-scan-app
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::12}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        if: ${{ env.DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 root@165.232.106.224 '
            cd /root/assurance-scan &&
            git pull --ff-only --quiet &&
            docker image prune -af >/dev/null &&
            docker builder prune -af >/dev/null &&
            docker compose --profile public pull -q &&
            docker compose --profile public up -d --remove-orphans
          '
