name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.18.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend quality dependencies
        run: python -m pip install --requirement backend/requirements/dev.txt
      - name: Run deterministic quality gate
        env:
          QUALITY_GATE_PYTHON: python
        run: backend/scripts/quality-gate.sh
