# assurance-scan — vendored CI stub for organisations outside the scanner's
# own GitHub org. Copy to .github/workflows/assurance-scan.yml in your repo.
#
# One edit required: ASSURANCE_SCAN_URL below must point at your
# organisation's assurance-scan instance (deep links land there).
# Keep the workflow name exactly "assurance-scan" — your instance's poller
# filters runs by this name.

name: assurance-scan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [<default branch>]

permissions:
  contents: read
  actions: write        # build layer cache
  pull-requests: write  # findings comment

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (if Dockerfile present)
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          load: true
          tags: assurance-scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
      - name: Run assurance-scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
            -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e ASSURANCE_SCAN_URL=https://scan.your-organisation.example \
            ghcr.io/26457513/assurance-scan-ci:latest \
            "$PWD" --sarif "$PWD/assurance.sarif" --image assurance-scan-target:ci
          cat "$PWD/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assurance-scan-results
          path: |
            assurance.sarif
            sbom.cyclonedx.json
            findings.json
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: assurance-scan
          path: summary.md
