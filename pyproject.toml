[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assurance-scan-server"
version = "2.0.0-dev"
description = "Single-user assurance MCP service — runs best-in-breed scanners, exposes findings + state via MCP and REST."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["tests/phase1"]
asyncio_mode = "auto"
pythonpath = ["."]
